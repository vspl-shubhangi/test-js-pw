name: Eva Playwright E2E Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# Minimum permissions required by the workflow
permissions:
  contents: read

# Prevent duplicate runs for the same branch/PR
concurrency:
  group: eva-playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  playwright-tests:

    name: Eva E2E Tests

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      BASE_URL: https://evafi.relintex.dev/

      # CI environment
      CI: true

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # --------------------------------------------------
      # 3. Install Python dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install \
            pytest \
            pytest-playwright \
            pytest-html \
            pytest-xdist


      # --------------------------------------------------
      # 4. Install Playwright Chromium
      # --------------------------------------------------
      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium


      # --------------------------------------------------
      # 5. Verify environment
      # --------------------------------------------------
      - name: Verify test environment
        run: |
          echo "Python version:"
          python --version

          echo "Pytest version:"
          pytest --version

          echo "Playwright version:"
          python -m playwright --version

          echo "BASE_URL:"
          echo "$BASE_URL"


      # --------------------------------------------------
      # 6. Run Playwright tests
      # --------------------------------------------------
      - name: Run Eva Playwright tests
        id: playwright
        continue-on-error: true
        run: |
          mkdir -p reports

          pytest tests/ \
            -o addopts="" \
            --browser chromium \
            -n 2 \
            --html=reports/report.html \
            --self-contained-html \
            --junitxml=reports/junit.xml

          echo "exit_code=$?" >> "$GITHUB_OUTPUT"


      # --------------------------------------------------
      # 7. Collect Playwright screenshots
      # --------------------------------------------------
      - name: Compress Playwright screenshots
        if: always()
        run: |
          if [ -d "reports/screenshots" ] && \
             [ "$(find reports/screenshots -type f | wc -l)" -gt 0 ]; then

            tar -czf playwright-screenshots.tar.gz \
              -C reports screenshots

            echo "Screenshots compressed successfully."

          else
            echo "No Playwright screenshots found."
          fi


      # --------------------------------------------------
      # 8. Upload HTML + JUnit reports
      # --------------------------------------------------
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eva-playwright-reports-${{ github.run_number }}
          path: |
            reports/report.html
            reports/junit.xml
          if-no-files-found: ignore
          retention-days: 14


      # --------------------------------------------------
      # 9. Upload screenshots
      # --------------------------------------------------
      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eva-playwright-screenshots-${{ github.run_number }}
          path: playwright-screenshots.tar.gz
          if-no-files-found: ignore
          retention-days: 14


      # --------------------------------------------------
      # 10. Upload Playwright test-results
      # --------------------------------------------------
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eva-playwright-test-results-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14


      # --------------------------------------------------
      # 11. GitHub Actions summary
      # --------------------------------------------------
      - name: Test summary
        if: always()
        run: |
          echo "## Eva Playwright E2E Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | CI |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Browser | Chromium |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Base URL | $BASE_URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Workers | 2 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run | #${{ github.run_number }} |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Reports and screenshots are available in GitHub Actions Artifacts." >> "$GITHUB_STEP_SUMMARY"


      # --------------------------------------------------
      # 12. Fail pipeline if tests failed
      # --------------------------------------------------
      - name: Final test status
        if: always()
        run: |
          if [ "${{ steps.playwright.outputs.exit_code }}" != "0" ]; then
            echo "=========================================="
            echo "EVA PLAYWRIGHT TESTS FAILED"
            echo "=========================================="
            exit 1
          fi

          echo "=========================================="
          echo "EVA PLAYWRIGHT TESTS PASSED"
          echo "=========================================="