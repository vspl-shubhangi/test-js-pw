name: Eva Playwright E2E Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eva-playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  playwright-tests:

    name: Eva E2E Tests

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      BASE_URL: https://evafi.relintex.dev/
      CI: true

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip


      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install \
            pytest \
            pytest-playwright \
            pytest-html \
            pytest-xdist


      # --------------------------------------------------
      # 4. Install Playwright browser
      # --------------------------------------------------
      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium


      # --------------------------------------------------
      # 5. Verify environment
      # --------------------------------------------------
      - name: Verify environment
        run: |
          echo "=========================================="
          echo "Environment"
          echo "=========================================="

          echo "Python:"
          python --version

          echo "Pytest:"
          pytest --version

          echo "Playwright:"
          python -m playwright --version

          echo "BASE_URL:"
          echo "$BASE_URL"


      # --------------------------------------------------
      # 6. Run Playwright tests
      # --------------------------------------------------
      - name: Run Eva Playwright tests
        id: playwright
        shell: bash
        run: |
          mkdir -p reports

          set +e

          pytest tests/ \
            -o addopts="" \
            --browser chromium \
            -n 2 \
            --html=reports/report.html \
            --self-contained-html \
            --junitxml=reports/junit.xml

          TEST_EXIT_CODE=$?

          echo "TEST_EXIT_CODE=$TEST_EXIT_CODE" >> "$GITHUB_ENV"

          echo "Playwright exit code: $TEST_EXIT_CODE"

          # Do not fail yet.
          # Reports and artifacts must be collected first.
          exit 0


      # --------------------------------------------------
      # 7. Compress screenshots
      # --------------------------------------------------
      - name: Compress Playwright screenshots
        if: always()
        shell: bash
        run: |
          if [ -d "reports/screenshots" ] && \
             [ "$(find reports/screenshots -type f | wc -l)" -gt 0 ]; then

            tar -czf playwright-screenshots.tar.gz \
              -C reports screenshots

            echo "Screenshots compressed successfully."

          else
            echo "No screenshots found."
          fi


      # --------------------------------------------------
      # 8. Upload HTML + JUnit reports
      # --------------------------------------------------
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eva-playwright-reports-${{ github.run_number }}
          path: |
            reports/report.html
            reports/junit.xml
          if-no-files-found: ignore
          retention-days: 14


      # --------------------------------------------------
      # 9. Upload screenshots
      # --------------------------------------------------
      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eva-playwright-screenshots-${{ github.run_number }}
          path: playwright-screenshots.tar.gz
          if-no-files-found: ignore
          retention-days: 14


      # --------------------------------------------------
      # 10. Upload Playwright test results / traces
      # --------------------------------------------------
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eva-playwright-test-results-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14


      # --------------------------------------------------
      # 11. GitHub Actions summary
      # --------------------------------------------------
      - name: Test summary
        if: always()
        shell: bash
        run: |
          echo "## Eva Playwright E2E Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | CI |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Browser | Chromium |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Workers | 2 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Base URL | $BASE_URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run | #${{ github.run_number }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test Exit Code | ${TEST_EXIT_CODE:-unknown} |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Reports and diagnostic artifacts are available above." \
            >> "$GITHUB_STEP_SUMMARY"


      # --------------------------------------------------
      # 12. Final status
      # --------------------------------------------------
      - name: Final test status
        if: always()
        shell: bash
        run: |
          echo "=========================================="

          if [ "${TEST_EXIT_CODE:-1}" -ne 0 ]; then
            echo "EVA PLAYWRIGHT TESTS FAILED"
            echo "Exit code: ${TEST_EXIT_CODE:-unknown}"
            echo "=========================================="
            exit 1
          fi

          echo "EVA PLAYWRIGHT TESTS PASSED"
          echo "=========================================="