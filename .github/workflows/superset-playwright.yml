name: Superset Playwright CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: superset
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d superset"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"


      # --------------------------------------------------
      # 3. Install Python dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # --------------------------------------------------
      # 4. Install Playwright browsers
      # --------------------------------------------------
      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium


      # --------------------------------------------------
      # 5. Verify PostgreSQL
      # --------------------------------------------------
      - name: Verify PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pg_isready -h localhost -p 5432 -U postgres


      # --------------------------------------------------
      # 6. Start Superset
      # --------------------------------------------------
      - name: Start Superset
        run: |
          docker run -d \
            --name superset \
            -p 8088:8088 \
            apache/superset:latest

          echo "Waiting for Superset..."

          for i in {1..30}; do
            if curl -f http://localhost:8088/health; then
              echo "Superset is ready"
              break
            fi

            sleep 5
          done


      # --------------------------------------------------
      # 7. Display Superset URL
      # --------------------------------------------------
      - name: Superset URL
        run: |
          echo "Superset is available inside CI at:"
          echo "http://localhost:8088"


      # --------------------------------------------------
      # 8. Run Playwright tests
      # --------------------------------------------------
      - name: Run Playwright tests
        env:
          PLAYWRIGHT_HEADLESS: "true"
          BASE_URL: "http://localhost:8088"
        run: |
          pytest tests/ \
            --browser chromium \
            --html=report.html \
            --self-contained-html


      # --------------------------------------------------
      # 9. Upload Playwright report
      # --------------------------------------------------
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-report
          path: |
            report.html
            test-results/
            playwright-report/
          if-no-files-found: ignore


      # --------------------------------------------------
      # 10. Upload pytest results
      # --------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            report.html
            test-results/
          if-no-files-found: ignore


      # --------------------------------------------------
      # 11. Cleanup
      # --------------------------------------------------
      - name: Stop Superset
        if: always()
        run: |
          docker stop superset || true
          docker rm superset || true