name: Superset Playwright CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  test:

    name: Superset E2E Tests

    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: superset

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d superset"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:

      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------

      - name: Checkout source code
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Setup Python
      # ---------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"


      # ---------------------------------------------------------
      # 3. Install Python dependencies
      # ---------------------------------------------------------

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install pytest pytest-playwright pytest-html


      # ---------------------------------------------------------
      # 4. Install Playwright Chromium
      # ---------------------------------------------------------

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium


      # ---------------------------------------------------------
      # 5. Verify PostgreSQL
      # ---------------------------------------------------------

      - name: Verify PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

          echo "Waiting for PostgreSQL..."

          timeout 60s bash -c '
            until pg_isready \
              -h 127.0.0.1 \
              -p 5432 \
              -U postgres \
              -d superset
            do
              sleep 2
            done
          '

          echo "PostgreSQL is ready."


      # ---------------------------------------------------------
      # 6. Start Superset
      # ---------------------------------------------------------

      - name: Start Superset
        run: |

          docker run -d \
            --name superset \
            -p 8088:8088 \
            -e SUPERSET_SECRET_KEY="ci-secret-key-change-me" \
            apache/superset:latest

          echo "Superset container started."

          docker ps


      # ---------------------------------------------------------
      # 7. Check Superset container
      # ---------------------------------------------------------

      - name: Check Superset container
        run: |

          sleep 10

          if ! docker ps --format '{{.Names}}' | grep -q '^superset$'; then
            echo "Superset container is not running."

            echo "===== Superset logs ====="
            docker logs superset || true

            exit 1
          fi

          echo "Superset container is running."


      # ---------------------------------------------------------
      # 8. Wait for Superset
      # ---------------------------------------------------------

      - name: Wait for Superset
        run: |

          echo "Waiting for Superset to become available..."

          for i in {1..60}; do

            echo "Health check attempt $i/60"

            if curl \
              --silent \
              --show-error \
              --fail \
              --connect-timeout 2 \
              --max-time 5 \
              http://127.0.0.1:8088/health; then

              echo ""
              echo "Superset is ready."

              break
            fi

            if ! docker ps --format '{{.Names}}' | grep -q '^superset$'; then

              echo "Superset container stopped unexpectedly."

              echo "===== Superset logs ====="

              docker logs superset || true

              exit 1
            fi

            sleep 5

          done


      # ---------------------------------------------------------
      # 9. Final Superset health check
      # ---------------------------------------------------------

      - name: Verify Superset
        run: |

          echo "Testing Superset..."

          curl \
            --fail \
            --connect-timeout 5 \
            --max-time 10 \
            http://127.0.0.1:8088/health

          echo ""
          echo "Superset is accessible."


      # ---------------------------------------------------------
      # 10. Display CI Superset URL
      # ---------------------------------------------------------

      - name: Superset CI URL
        run: |

          echo "=========================================="
          echo "Superset is running inside GitHub runner"
          echo "=========================================="
          echo ""
          echo "URL:"
          echo "http://127.0.0.1:8088"
          echo ""
          echo "IMPORTANT:"
          echo "This URL is accessible only inside the GitHub runner."
          echo "It is NOT publicly accessible from your browser."
          echo "=========================================="


      # ---------------------------------------------------------
      # 11. Create reports directory
      # ---------------------------------------------------------

      - name: Prepare test reports
        run: |
          mkdir -p reports
          mkdir -p test-results
          mkdir -p playwright-report


      # ---------------------------------------------------------
      # 12. Run Playwright tests
      # ---------------------------------------------------------
      #
      # IMPORTANT:
      #
      # pytest.ini contains:
      #
      #   --headed
      #   --browser-channel chrome
      #   -n 4
      #
      # GitHub runner does not have an X server.
      #
      # Therefore we override addopts:
      #
      #   -o addopts=""
      #
      # and explicitly run headless Chromium.
      #
      # ---------------------------------------------------------

      - name: Run Playwright tests
        env:
          BASE_URL: "http://127.0.0.1:8088"
          PLAYWRIGHT_HEADLESS: "true"

        run: |

          pytest tests/ \
            -o addopts="" \
            --browser chromium \
            --html=reports/report.html \
            --self-contained-html


      # ---------------------------------------------------------
      # 13. Upload Playwright HTML report
      # ---------------------------------------------------------

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: playwright-html-report
          path: |
            reports/report.html
          if-no-files-found: warn


      # ---------------------------------------------------------
      # 14. Upload Playwright test results
      # ---------------------------------------------------------

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore


      # ---------------------------------------------------------
      # 15. Collect Superset logs
      # ---------------------------------------------------------

      - name: Collect Superset logs
        if: always()
        run: |

          echo "=========================================="
          echo "SUPSERSET CONTAINER STATUS"
          echo "=========================================="

          docker ps -a || true

          echo ""
          echo "=========================================="
          echo "SUPSERSET LOGS"
          echo "=========================================="

          docker logs superset 2>&1 || true


      # ---------------------------------------------------------
      # 16. Save Superset logs as artifact
      # ---------------------------------------------------------

      - name: Save Superset logs
        if: always()
        run: |

          mkdir -p docker-logs

          docker logs superset \
            > docker-logs/superset.log 2>&1 || true


      # ---------------------------------------------------------
      # 17. Upload Superset logs
      # ---------------------------------------------------------

      - name: Upload Superset logs
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: superset-logs
          path: docker-logs/
          if-no-files-found: ignore


      # ---------------------------------------------------------
      # 18. Cleanup
      # ---------------------------------------------------------

      - name: Cleanup Superset
        if: always()
        run: |

          docker stop superset || true
          docker rm superset || true