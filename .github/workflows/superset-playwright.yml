name: Superset Playwright CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================================
  # TEST JOB
  # ==========================================================

  test:

    name: Superset Playwright Tests

    runs-on: ubuntu-latest

    services:

      # ========================================================
      # PostgreSQL
      # ========================================================

      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: superset

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d superset"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10


    steps:

      # ========================================================
      # 1. Checkout source code
      # ========================================================

      - name: Checkout source code
        uses: actions/checkout@v4


      # ========================================================
      # 2. Setup Python
      # ========================================================

      - name: Setup Python
        uses: actions/setup-python@v6

        with:
          python-version: "3.12"
          cache: pip


      # ========================================================
      # 3. Install Python dependencies
      # ========================================================

      - name: Install Python dependencies
        run: |

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install \
            pytest \
            pytest-playwright \
            pytest-html \
            pytest-xdist


      # ========================================================
      # 4. Install Playwright Chromium
      # ========================================================

      - name: Install Playwright Chromium
        run: |

          playwright install --with-deps chromium


      # ========================================================
      # 5. Verify PostgreSQL
      # ========================================================

      - name: Verify PostgreSQL

        env:
          PGPASSWORD: postgres

        run: |

          sudo apt-get update
          sudo apt-get install -y postgresql-client

          echo "Waiting for PostgreSQL..."

          timeout 60s bash -c '
            until pg_isready \
              -h 127.0.0.1 \
              -p 5432 \
              -U postgres \
              -d superset
            do
              sleep 2
            done
          '

          echo "PostgreSQL is ready."


      # ========================================================
      # 6. Prepare Superset Docker image
      # ========================================================

      - name: Prepare Superset Docker image
        run: |

          echo "Checking for custom Superset Dockerfile..."

          if [ -f Dockerfile ]; then

            echo "Custom Dockerfile found."
            echo "Building custom Superset image..."

            docker build \
              -t superset-playwright-ci:latest \
              .

            echo "Custom Superset image built."

          else

            echo "No Dockerfile found."
            echo "Using apache/superset:latest."

            docker pull apache/superset:latest

            docker tag \
              apache/superset:latest \
              superset-playwright-ci:latest

          fi


      # ========================================================
      # 7. Start Superset
      # ========================================================

      - name: Start Superset
        run: |

          docker run -d \
            --name superset \
            -p 8088:8088 \
            -e SUPERSET_SECRET_KEY="ci-secret-key-change-me" \
            superset-playwright-ci:latest

          echo "Superset container started."

          docker ps


      # ========================================================
      # 8. Check Superset container
      # ========================================================

      - name: Check Superset container
        run: |

          sleep 10

          if ! docker ps --format '{{.Names}}' | grep -q '^superset$'; then

            echo "Superset container is not running."

            echo "=========================================="
            echo "SUPERSET CONTAINER STATUS"
            echo "=========================================="

            docker ps -a || true

            echo "=========================================="
            echo "SUPERSET LOGS"
            echo "=========================================="

            docker logs superset || true

            exit 1

          fi

          echo "Superset container is running."


      # ========================================================
      # 9. Wait for Superset
      # ========================================================

      - name: Wait for Superset
        run: |

          echo "Waiting for Superset to become ready..."

          SUPERSET_READY=false

          for i in {1..60}; do

            echo "Health check $i/60"

            if curl \
              --silent \
              --show-error \
              --fail \
              --connect-timeout 2 \
              --max-time 5 \
              http://127.0.0.1:8088/health; then

              echo ""
              echo "Superset is ready."

              SUPERSET_READY=true

              break

            fi


            # --------------------------------------------------
            # Check if container is still running
            # --------------------------------------------------

            if ! docker ps --format '{{.Names}}' | grep -q '^superset$'; then

              echo "Superset container stopped unexpectedly."

              echo "=========================================="
              echo "SUPERSET LOGS"
              echo "=========================================="

              docker logs superset || true

              exit 1

            fi

            sleep 5

          done


          # ----------------------------------------------------
          # Fail if Superset never became ready
          # ----------------------------------------------------

          if [ "$SUPERSET_READY" != "true" ]; then

            echo "Superset did not become ready within the timeout."

            echo "=========================================="
            echo "SUPERSET LOGS"
            echo "=========================================="

            docker logs superset || true

            exit 1

          fi


      # ========================================================
      # 10. Final Superset health check
      # ========================================================

      - name: Verify Superset
        run: |

          echo "Checking Superset health..."

          curl \
            --fail \
            --connect-timeout 5 \
            --max-time 10 \
            http://127.0.0.1:8088/health

          echo ""
          echo "Superset is accessible."


      # ========================================================
      # 11. Display Superset URL
      # ========================================================

      - name: Display Superset URL
        run: |

          echo "=========================================="
          echo "SUPERSET CI URL"
          echo "=========================================="
          echo ""
          echo "http://127.0.0.1:8088"
          echo ""
          echo "IMPORTANT:"
          echo "This URL is available only inside"
          echo "the GitHub Actions runner."
          echo ""
          echo "It cannot be opened from your laptop."
          echo "=========================================="


      # ========================================================
      # 12. Prepare report directories
      # ========================================================

      - name: Prepare report directories
        run: |

          mkdir -p reports
          mkdir -p reports/screenshots
          mkdir -p test-results
          mkdir -p playwright-report


      # ========================================================
      # 13. Run Playwright tests
      # ========================================================
      #
      # pytest.ini contains:
      #
      #   -n 4
      #   --browser chromium
      #   --headed
      #   --browser-channel chrome
      #
      # We override pytest.ini addopts here.
      #
      # -o addopts=""
      #
      # removes the default options.
      #
      # CI then explicitly uses:
      #
      #   Chromium
      #   Headless
      #   4 workers
      #
      # No --headed.
      #
      # ========================================================

      - name: Run Playwright tests

        id: playwright-tests

        continue-on-error: true

        env:
          BASE_URL: "http://127.0.0.1:8088"

        run: |

          echo "=========================================="
          echo "PLAYWRIGHT TEST EXECUTION"
          echo "=========================================="

          echo "BASE_URL=$BASE_URL"

          pytest tests/ \
            -o addopts="" \
            --browser chromium \
            -n 4 \
            --html=reports/report.html \
            --self-contained-html

          TEST_EXIT_CODE=$?

          echo "Playwright exit code: $TEST_EXIT_CODE"

          echo "TEST_EXIT_CODE=$TEST_EXIT_CODE" >> "$GITHUB_ENV"

          exit $TEST_EXIT_CODE


      # ========================================================
      # 14. Display test result
      # ========================================================

      - name: Display Playwright test result
        if: always()
        run: |

          echo "=========================================="
          echo "PLAYWRIGHT TEST RESULT"
          echo "=========================================="

          if [ "${TEST_EXIT_CODE:-1}" -eq 0 ]; then

            echo "STATUS: PASSED"

          else

            echo "STATUS: FAILED"

          fi

          echo ""
          echo "Exit Code: ${TEST_EXIT_CODE:-unknown}"

          echo "=========================================="


      # ========================================================
      # 15. Upload HTML report
      # ========================================================

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: playwright-html-report
          path: reports/report.html
          if-no-files-found: warn


      # ========================================================
      # 16. Compress screenshots
      # ========================================================
      #
      # IMPORTANT:
      #
      # Playwright may generate filenames such as:
      #
      # test_faq_accordion_expands_on_click[
      # chromium-How do I get loan offers?]_20260904.png
      #
      # GitHub artifact upload rejects characters such as:
      #
      # ?
      # :
      # *
      # <
      # >
      # |
      #
      # Therefore we archive the screenshots first.
      #
      # GitHub only sees:
      #
      # playwright-screenshots.tar.gz
      #
      # ========================================================

      - name: Compress Playwright screenshots
        if: always()
        run: |

          echo "Checking screenshot directory..."

          if [ -d "reports/screenshots" ] && \
             [ "$(find reports/screenshots -type f | wc -l)" -gt 0 ]; then

            echo "Screenshots found."

            echo "Number of screenshots:"
            find reports/screenshots -type f | wc -l

            tar -czf \
              playwright-screenshots.tar.gz \
              -C reports \
              screenshots

            echo "Screenshot archive created."

            ls -lh playwright-screenshots.tar.gz

          else

            echo "No screenshots found."

          fi


      # ========================================================
      # 17. Upload screenshots
      # ========================================================

      - name: Upload Playwright screenshots
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: playwright-screenshots
          path: playwright-screenshots.tar.gz
          if-no-files-found: ignore


      # ========================================================
      # 18. Upload Playwright test results
      # ========================================================

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: playwright-test-results

          path: |
            test-results/
            playwright-report/

          if-no-files-found: ignore


      # ========================================================
      # 19. Collect Superset logs
      # ========================================================

      - name: Collect Superset logs
        if: always()
        run: |

          mkdir -p docker-logs

          echo "Collecting Docker status..."

          docker ps -a \
            > docker-logs/docker-status.txt 2>&1 || true


          echo "Collecting Superset logs..."

          docker logs superset \
            > docker-logs/superset.log 2>&1 || true


          echo "Collecting Superset inspect information..."

          docker inspect superset \
            > docker-logs/superset-inspect.json 2>&1 || true


          echo "Collected logs:"

          ls -lh docker-logs/


      # ========================================================
      # 20. Upload Superset logs
      # ========================================================

      - name: Upload Superset logs
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: superset-logs
          path: docker-logs/
          if-no-files-found: ignore


      # ========================================================
      # 21. Generate CI summary
      # ========================================================

      - name: Generate GitHub Actions summary
        if: always()
        run: |

          echo "# Superset Playwright CI/CD" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Superset" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "- Container: \`superset\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Port: \`8088\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- CI URL: \`http://127.0.0.1:8088\`" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Playwright" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "- Browser: Chromium" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: Headless" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workers: 4" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${TEST_EXIT_CODE:-1}" -eq 0 ]; then

            echo "### Result: PASSED" >> "$GITHUB_STEP_SUMMARY"

          else

            echo "### Result: FAILED" >> "$GITHUB_STEP_SUMMARY"

          fi


      # ========================================================
      # 22. Cleanup Superset
      # ========================================================

      - name: Cleanup Superset
        if: always()
        run: |

          echo "Stopping Superset..."

          docker stop superset || true

          echo "Removing Superset..."

          docker rm superset || true

          echo "Cleanup completed."


      # ========================================================
      # 23. Fail job if Playwright tests failed
      # ========================================================

      - name: Final Playwright status
        if: always()
        run: |

          if [ "${TEST_EXIT_CODE:-1}" -ne 0 ]; then

            echo "=========================================="
            echo "PLAYWRIGHT TESTS FAILED"
            echo "=========================================="

            exit 1

          fi

          echo "=========================================="
          echo "PLAYWRIGHT TESTS PASSED"
          echo "=========================================="