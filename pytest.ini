[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; Default CLI options applied to every run (override on the command line
; if needed, e.g. pytest --browser firefox --headed)
; --browser chromium + --browser-channel chrome tells Playwright to drive
; the real, installed Google Chrome browser (not its bundled Chromium build).
;
; -n 4 (pytest-xdist): runs tests across 4 PARALLEL worker processes, so
; e.g. the 4 browser parametrizations (chrome/firefox/brave/msedge) of
; the same test method run concurrently instead of one after another --
; this is the mechanism behind req #2 (cutting the ~3-4hr sequential
; runtime). Each worker launches its OWN independent browser instance
; (Playwright fixtures are per-test/per-process, so there's no shared
; state to worry about between workers). 4 is a reasonable default given
; --headed mode pops up a real visible browser window per worker --
; tune it to your machine: `pytest -n auto` uses all CPU cores (fastest,
; but heavier on RAM/CPU with 4 real headed browsers running at once),
; `pytest -n 2` if 4 concurrent headed browsers is too much for your
; hardware, or `pytest -n 0` to fall back to fully sequential (useful
; for debugging a single flaky test in isolation).
addopts =
    -v
    -n 4
    --browser chromium
    --headed
    --browser-channel chrome
    --html=reports/report.html
    --self-contained-html

; Playwright / pytest-playwright specific markers used across the suite
markers =
    smoke: fast critical-path checks
    e2e: full realistic end-to-end journeys
    ui: pure UI-state / rendering checks
    cross_device: desktop/tablet/mobile parametrized checks
    cross_browser: same-suite checks tagged by --browser engine (run 3x with different --browser flags for full coverage)
    regression: negative, boundary, and detailed coverage checks
    functional: textbox validation -- valid input, whitespace, blur, unicode, special chars, BVA
    data_retention: privacy/data-retention checks (reload, storage, context isolation)
    security: SQL-injection and XSS coverage
    keyboard: keyboard-only interaction coverage (Tab, Shift+Tab, Enter, Escape)
    happy_path: full valid-data journey across the device x browser matrix
    emulation: browser environment emulation checks (dark mode, geolocation, timezone/locale, offline, reduced motion, permissions)